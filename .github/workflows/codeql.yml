# CodeQL code scanning.
#
# Started from the workflow GitHub generates when you switch a repository from
# default setup to advanced, with three changes:
#   - config-file, which is the reason for running advanced setup at all: it is
#     what keeps tests/ and the vendored chart.js out of the results, and
#     default setup has no way to express that.
#   - checkout v7, because v4 targets Node 20 and the runners now force those
#     actions onto Node 24 with a deprecation warning.
#   - dropped the swift runner switch and the manual-build step: this repo
#     analyses one language and builds nothing, so neither can ever fire.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '21 20 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
